name: Release macOS

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-version.sh
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.version.outputs.release == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.release == 'true'
        with:
          node-version: '22'
      - name: Setup and test
        if: steps.version.outputs.release == 'true'
        run: |
          ./scripts/desktop.sh setup
          ./scripts/desktop.sh test
      # The script materializes every credential into one private temporary
      # directory and removes it, and its keychain, through an EXIT trap.
      - name: Build, sign, notarize, and package
        if: success() && steps.version.outputs.release == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          INNERLY_UPDATE_PRIVATE_KEY: ${{ secrets.INNERLY_UPDATE_PRIVATE_KEY }}
          INNERLY_UPDATE_PUBLIC_KEY: ${{ secrets.INNERLY_UPDATE_PUBLIC_KEY }}
        run: ./scripts/release-macos.sh --ci
      - name: Publish release
        if: success() && steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/innerly-release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "release/Innerly-$RELEASE_VERSION-mac-universal.zip" \
            "release/Innerly-$RELEASE_VERSION-mac-universal.zip.sha256" \
            "release/Innerly-$RELEASE_VERSION-mac-universal.dmg" \
            "release/Innerly-$RELEASE_VERSION-mac-universal.dmg.sha256" \
            release/manifest.json
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/innerly-release-notes.md" --draft=false
