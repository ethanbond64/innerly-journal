[project]
name = "innerly-api"
version = "1.0.0"
description = "Innerly journal backend."
requires-python = ">=3.11"

# Only packages the code imports directly, or invokes (gunicorn). Everything else
# is resolved transitively and recorded in uv.lock.
dependencies = [
    "cryptography==50.0.0",
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "gunicorn==23.0.0",
    "itsdangerous==2.2.0",
    "SQLAlchemy==2.0.50",
    "Werkzeug==3.1.8",
]

[tool.uv]
# The app is run as `gunicorn "entrypoint:create_app()"` rather than installed as
# a package, so uv manages dependencies only.
package = false
