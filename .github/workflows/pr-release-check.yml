name: PR release validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-version.sh
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.version.outputs.release == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.release == 'true'
        with:
          node-version: '22'
      - name: Setup
        if: steps.version.outputs.release == 'true'
        run: ./scripts/desktop.sh setup
      - name: Tests
        if: steps.version.outputs.release == 'true'
        run: ./scripts/desktop.sh test
      - name: Universal build (no secrets on PRs)
        if: steps.version.outputs.release == 'true'
        run: ./scripts/desktop.sh build ARCH=universal
