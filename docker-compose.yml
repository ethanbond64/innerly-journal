version: '2'

services:

  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: gunicorn -b 0.0.0.0:8000 --access-logfile - "entrypoint:create_app()"
    env_file:
      - '.env'
    volumes:
      - './backend:/backend'
      - '~/.innerly:/root/.innerly'
    ports:
      - '8000:8000'
