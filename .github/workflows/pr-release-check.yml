name: PR release validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 TODO use latest version 6 or just checkout with git directly as shell
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test release helpers # TODO remove
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Detect and validate new version # TODO rewrite the script and use shell instead of python. Keep it simple and just validate if the release version already exists. No need to overengineer this garbage with the shas.
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/release-version.py --base "$BASE_SHA" --head "$HEAD_SHA" --notes "$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.version.outputs.release == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.release == 'true'
        with:
          node-version: '22'
      - name: Setup
        if: steps.version.outputs.release == 'true'
        run: ./scripts/desktop.sh setup
      - name: Tests
        if: steps.version.outputs.release == 'true'
        run: ./scripts/desktop.sh test
      - name: Universal build (no secrets on PRs)
        if: steps.version.outputs.release == 'true'
        run: ./scripts/desktop.sh build -platform darwin/universal
