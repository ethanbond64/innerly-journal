version: '3'
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, .work, node_modules, frontend, build, release]
    file: ["*_test.go"]
    watched_extension: ["*.go"]
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true ARCH=native
      type: blocking
    - cmd: npm --prefix frontend run start -- --port 3000 --strictPort
      type: background
      readiness:
        http: http://localhost:3000/
        timeout: 60s
        interval: 200ms
    - cmd: wails3 task run ARCH=native
      type: primary
      exit_policy: shutdown
