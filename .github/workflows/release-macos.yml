name: Release macOS

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-version.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.release == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.version.outputs.release == 'true'
        with:
          node-version: '22'
      - name: Setup and test
        if: steps.version.outputs.release == 'true'
        run: |
          ./scripts/desktop.sh setup
          ./scripts/desktop.sh test
      - name: Install signing and notarization credentials
        if: success() && steps.version.outputs.release == 'true'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
        run: ./scripts/ci-macos-keychain.sh setup
      - name: Build, sign, notarize, and package
        if: success() && steps.version.outputs.release == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          ./scripts/release-macos.sh \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --keychain "$RUNNER_TEMP/innerly-signing.keychain-db" \
            --api-key "$RUNNER_TEMP/innerly-notary.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"
      - name: Remove private signing material
        if: always() && steps.version.outputs.release == 'true'
        run: ./scripts/ci-macos-keychain.sh cleanup
      - name: Publish release
        if: success() && steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/innerly-release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            "release/Innerly-$RELEASE_VERSION-mac-universal.zip" \
            "release/Innerly-$RELEASE_VERSION-mac-universal.zip.sha256"
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/innerly-release-notes.md" --draft=false
